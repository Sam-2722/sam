<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}try{if(localStorage.getItem("calm")==="1")document.documentElement.classList.add("calm");else if(!sessionStorage.getItem("introSeen"))document.documentElement.classList.add("intro-on")}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="intro" aria-hidden="true"><div class="intro-name" id="introName"></div><svg class="scribble" viewBox="0 0 300 20"><path pathLength="1" d="M3 12C40 2 70 20 110 9S190 3 230 12 280 14 297 6"/></svg><p id="introRole"></p></div>
<div id="progress"></div>
<header class="bar">
  <a class="brand" href="#home" id="brand"></a>
  <nav id="menu" aria-label="Main">
    <a href="#home">Home</a><a href="#works">Works</a><a href="#about">About</a><a href="#contact">Contact</a>
  </nav>
  <button id="motion" class="icon" aria-label="Turn animations on or off" title="Animations on/off">&#10022;</button>
  <button id="theme" class="icon" aria-label="Switch light or dark mode">&#9680;</button>
  <button id="burger" class="icon" aria-label="Open menu" aria-expanded="false">&#9776;</button>
</header>

<div id="main">
  <div id="homeView">
    <section id="home" class="hero">
      <aside class="doodles" id="doodles" aria-hidden="true"></aside>
      <img id="pfp" class="pfp" alt="">
      <div>
        <h1 id="name"></h1>
        <p class="role rv" style="--d:.5" id="title"></p>
        <p class="lead rv" style="--d:.6" id="tagline"></p>
        <div class="rv" style="--d:.7"><a class="btn" href="#works">View my works</a> <a class="btn ghost" href="#contact">Contact me</a></div>
      </div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="track" id="marqueeTrack"></div><div class="track rev" id="marqueeTrack2"></div></div>

    <section id="works" class="wrap">
      <h2>Works</h2>
      <div class="filters">
        <label class="sr" for="q">Search works</label>
        <input id="q" type="search" placeholder="Search by title, medium, tool, or year">
        <label class="sr" for="cat">Medium</label><select id="cat"></select>
        <label class="sr" for="yr">Year</label><select id="yr"></select>
      </div>
      <p id="count" class="muted" aria-live="polite"></p>
      <div id="grid" class="gallery"></div>
    </section>

    <section id="about" class="wrap"><h2>About</h2><p id="bio" class="prose"></p></section>
    <section id="contact" class="wrap"><h2>Contact</h2><p id="contactText" class="prose"></p><div id="links" class="links"></div></section>
  </div>
  <article id="detailView" class="wrap" hidden></article>
</div>

<footer id="foot"></footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
